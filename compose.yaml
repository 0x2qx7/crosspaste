services:
  crosspaste:
    build: .
    image: crosspaste:latest
    container_name: crosspaste
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8089}:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: crosspaste-caddy
    restart: unless-stopped
    profiles:
      - caddy
    depends_on:
      crosspaste:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
